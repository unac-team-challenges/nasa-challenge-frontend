name: Compatibilidad de PR
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  reglas:
    name: reglas del equipo
    runs-on: ubuntu-latest
    env:
      TITULO: ${{ github.event.pull_request.title }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Título con prefijo
        run: |
          echo "$TITULO" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci)(\(.+\))?: .+' \
            || { echo "::error::El título debe empezar con feat:, fix:, chore:, docs:, refactor:, test: o ci:"; exit 1; }
      - name: main solo recibe developer
        run: |
          if [ "$BASE" = main ] && [ "$HEAD" != developer ]; then
            echo "::error::A main solo se entra desde developer"; exit 1
          fi
      - name: Solo pnpm-lock.yaml
        run: |
          if git ls-files | grep -Eq '(^|/)(package-lock\.json|yarn\.lock)$'; then
            echo "::error::Sube solo pnpm-lock.yaml"; exit 1
          fi
      - name: Changelog de la rama
        run: |
          git diff --name-only "origin/$BASE...HEAD" | grep -q '^changelog/' \
            || { echo "::error::Falta un archivo en changelog/"; exit 1; }
