<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peru Trend Detective · What is changing in your area?</title>
    <meta
      name="description"
      content="3D map of Peru with NASA data: how much rainfall and temperature changed in each department since 2001, and whether the change is real or chance."
    />
    <!-- Con sizes="any" Chrome elige el .ico y no el SVG (que sí cambia con el tema oscuro): el .ico va
         con su tamaño real y el SVG, al final, para los navegadores que lo entienden -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Tema: el color de la barra del navegador sigue al tema claro (Garúa) u oscuro (Humboldt) -->
    <meta name="theme-color" content="#d6c3a5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201c19" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Redes y mensajería (los rastreadores no ejecutan JS: aquí va la versión en inglés, el idioma por defecto).
         og:image necesita URL absoluta: al tener dominio, cambiar a https://<dominio>/og.png -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Peru Trend Detective" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_PE" />
    <meta property="og:title" content="Peru Trend Detective · What is changing in your area?" />
    <meta
      property="og:description"
      content="3D map of Peru with NASA data: how much rainfall and temperature changed in each department since 2001, and whether the change is real or chance."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peru Trend Detective · What is changing in your area?" />
    <meta
      name="twitter:description"
      content="3D map of Peru with NASA data: how much rainfall and temperature changed in each department since 2001, and whether the change is real or chance."
    />
    <meta name="twitter:image" content="/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
